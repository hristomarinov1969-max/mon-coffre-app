'use strict';
// V4: separate encrypted vault; never reads or migrates unencrypted V3 localStorage.
const KEY='moncoffre_v4_encrypted_v1';
const enc=new TextEncoder(),dec=new TextDecoder();

const toB64=u=>btoa(Array.from(u,b=>String.fromCharCode(b)).join(''));

function secureAvailable(){return !!(window.crypto&&crypto.subtle&&crypto.getRandomValues&&window.isSecureContext)}
async function derive(pass,salt){const raw=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

async function decryptVault(key,stored){const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:fromB64(stored.iv)},key,fromB64(stored.data));const parsed=JSON.parse(dec.decode(plain));if(!Array.isArray(parsed))throw Error('invalid vault');return parsed}

function lockVault(){vaultKey=null;vaultSalt=null;entries=[];current=null;editId=null;importRows=[];showAll=false;$('search').value='';$('results').replaceChildren();$('detailBody').replaceChildren();$('fields').replaceChildren();$('importPreview').replaceChildren();$('exportList').replaceChildren();$('master').value='';$('masterConfirm').value='';$('master').type='password';$('masterConfirm').type='password';$('appArea').classList.add('hidden');$('lockPage').classList.remove('hidden');$('lockError').textContent='';if(lockTimer)clearInterval(lockTimer);lockTimer=null;renderLock();status('')}
function touch(){lastActive=Date.now()}
function unlocked(){return !!vaultKey}
function startLock(){touch();if(lockTimer)clearInterval(lockTimer);lockTimer=setInterval(()=>{if(unlocked()&&Date.now()-lastActive>=60000)lockVault()},4000)}
function renderLock(){const existing=!!storedVault(),bg=lang==='bg';$('lockTitle').textContent=bg?'🔒 Моят сейф':'🔒 Mon Coffre';$('lockHelp').textContent=!secureAvailable()?(bg?'Този браузър не позволява защитено криптиране на този адрес. Отвори приложението през HTTPS.':'Le chiffrement sécurisé n’est pas disponible dans ce contexte. Il faut ouvrir l’application via HTTPS.'):(existing?(bg?'Отключи с главната парола. Автоматично заключване след 1 минута бездействие.':'Déverrouille avec ton mot de passe principal. Verrouillage après 1 minute d’inactivité.'):(bg?'Създай главна парола (поне 12 знака). Ако я забравиш, записите не могат да се възстановят.':'Crée un mot de passe principal (12 caractères minimum). Si tu l’oublies, les fiches ne pourront pas être récupérées.'));$('masterLabel').textContent=bg?'Главна парола':'Mot de passe principal';$('confirmLabel').textContent=bg?'Потвърди паролата':'Confirmer le mot de passe';$('confirmWrap').classList.toggle('hidden',existing);$('unlockBtn').textContent=existing?(bg?'Отключи':'Déverrouiller'):(bg?'Създай криптиран сейф':'Créer le coffre chiffré');$('unlockBtn').disabled=!secureAvailable();updateMasterEyes();$('lockNow').textContent=bg?'🔒 Заключи':'🔒 Verrouiller'}
async function unlock(){if(busy||!secureAvailable())return;const pass=$('master').value,existing=storedVault();if(pass.length<12&&!existing){$('lockError').textContent=lang==='bg'?'Нужни са поне 12 знака.':'Au moins 12 caractères sont nécessaires.';return}if(!existing&&pass!==$('masterConfirm').value){$('lockError').textContent=lang==='bg'?'Паролите са различни.':'Les mots de passe ne correspondent pas.';return}busy=true;$('unlockBtn').disabled=true;$('lockError').textContent='';try{let key,salt,loaded=[];if(existing){const record=JSON.parse(existing);if(record.version!==1)throw Error('format');salt=fromB64(record.salt);key=await derive(pass,salt);loaded=await decryptVault(key,record)}else{salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);const payload=await encryptVault(key,salt,[]);localStorage.setItem(KEY,payload)}vaultKey=key;vaultSalt=salt;entries=loaded.filter(x=>x&&typeof x.site==='string'&&Array.isArray(x.values));$('master').value='';$('masterConfirm').value='';$('lockPage').classList.add('hidden');$('appArea').classList.remove('hidden');view('home');translate();startLock()}catch(e){$('lockError').textContent=lang==='bg'?'Грешна парола или недостъпно хранилище.':'Mot de passe incorrect ou stockage indisponible.'}finally{busy=false;$('unlockBtn').disabled=!secureAvailable()}}

let lang='fr',formLang='fr',entries=[],current=null,editId=null,showAll=false,importRows=[];const $=id=>document.getElementById(id),t=()=>labels[lang];
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalize(s){let str=String(s||'').toLowerCase().trim();const bg='абвгдежзийклмнопрстуфхцчшщъьюя',lat=['a','b','v','g','d','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','h','ts','ch','sh','sht','a','','yu','ya'];let out='';for(const c of str){const i=bg.indexOf(c);out+=i>=0?lat[i]:c}return out.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/w/g,'v').replace(/ph/g,'f');}
const families=[['google','gugal','gugl'],['facebook','feysbuk','feisbuk'],['youtube','yutub'],['amazon','amazon']];
function matches(site,q){if(!q.trim())return true;let s=normalize(site),x=normalize(q);if(s.includes(x))return true;return families.some(f=>f.some(v=>s.includes(v))&&f.some(v=>v.includes(x)));}
async function persist(){if(!vaultKey||!vaultSalt)throw Error('locked');const payload=await encryptVault(vaultKey,vaultSalt,entries);localStorage.setItem(KEY,payload)}
function status(msg){$('status').textContent=msg;}
function view(name){['home','detail','editor','importPage','exportPage'].forEach(id=>$(id).classList.toggle('hidden',id!==name));}
function translate(){const z=t();$('subtitle').textContent=z.subtitle;$('warning').textContent=z.warning;$('searchLabel').textContent=z.search;$('search').placeholder=z.searchPh;$('addBtn').textContent=z.add;$('allBtn').textContent=showAll?z.hide:z.all;$('importBtn').textContent=z.import;$('exportBtn').textContent=z.export;$('editBtn').textContent=z.edit;$('shareDetail').textContent=z.share;$('deleteBtn').textContent=z.del;$('backDetail').textContent=z.back;$('cancelEdit').textContent=z.cancel;$('saveBtn').textContent=z.save;$('importTitle').textContent=z.importTitle;$('importHelp').textContent=z.importHelp;$('chooseLabel').textContent=z.choose;$('confirmImport').textContent=z.confirmImport;$('cancelImport').textContent=z.back;$('exportTitle').textContent=z.exportTitle;$('selectAll').textContent=z.allSelect;$('selectNone').textContent=z.noneSelect;$('confirmExport').textContent=z.confirmExport;$('shareExport').textContent=z.shareSelected;$('cancelExport').textContent=z.back;renderResults();renderExport();if(!$('editor').classList.contains('hidden'))renderFields(false);if(!$('detail').classList.contains('hidden'))renderDetail();}
function renderResults(){const q=$('search').value.trim(),box=$('results');box.innerHTML='';if(!q&&!showAll)return;let found=entries.filter(e=>matches(e.site,q)).sort((a,b)=>a.site.localeCompare(b.site));if(!found.length){box.innerHTML='<p class="muted">'+safe(t().empty)+'</p>';return;}for(const e of found){const el=document.createElement('div');el.className='item';el.textContent=e.site;el.addEventListener('click',()=>openDetail(e.id));box.appendChild(el)}}
function openDetail(id){current=id;renderDetail();view('detail');status('')}
function renderDetail(){const e=entries.find(x=>x.id===current);if(!e){view('home');return;}$('detailTitle').textContent=e.site;const body=$('detailBody');body.innerHTML='';for(let i=1;i<6;i++){const div=document.createElement('div');div.className='kv';const label=document.createElement('strong');label.textContent=t().fields[i];const val=document.createElement('div');val.className='detail';if(i===3){let visible=false;const span=document.createElement('span');span.textContent='••••••••';const b=document.createElement('button');b.className='secondary';b.style.marginLeft='12px';b.style.padding='5px 9px';b.textContent=t().show;b.onclick=()=>{visible=!visible;span.textContent=visible?(e.values[i]||''):'••••••••';b.textContent=visible?t().mask:t().show};val.append(span,b)}else val.textContent=e.values[i]||'—';div.append(label,val);body.appendChild(div)}}
function editor(id=null){editId=id;formLang=lang;renderFields(true);view('editor');status('')}
function renderFields(reset){const e=entries.find(x=>x.id===editId);$('editorTitle').textContent=editId!==null?labels[formLang].modify:labels[formLang].new;const box=$('fields');let vals=reset?(e?[e.site,...e.values.slice(1)]:Array(6).fill('')):Array.from(box.querySelectorAll('[data-field]')).map(el=>el.value);if(vals.length!==6)vals=Array(6).fill('');box.innerHTML='';labels[formLang].fields.forEach((title,i)=>{const label=document.createElement('label');label.textContent=title;label.htmlFor='field'+i;const el=document.createElement(i===4?'textarea':'input');el.id='field'+i;el.dataset.field=i;el.value=vals[i]||'';if(i===2)el.type='email';else if(i===3)el.type='password';else if(i!==4)el.type='text';if(i===0)el.required=true;box.append(label);if(i===3){const wrap=document.createElement('div');wrap.className='password-row';const toggle=document.createElement('button');toggle.type='button';toggle.className='secondary';toggle.textContent=labels[formLang].show;toggle.setAttribute('aria-label',labels[formLang].show);toggle.onclick=()=>{const reveal=el.type==='password';el.type=reveal?'text':'password';toggle.textContent=reveal?labels[formLang].mask:labels[formLang].show;toggle.setAttribute('aria-label',toggle.textContent)};wrap.append(el,toggle);box.appendChild(wrap)}else{box.appendChild(el)}})}
async function upsert(vals,id){const name=vals[0].trim();if(!name)return false;const same=entries.find(x=>x.site.toLocaleLowerCase()===name.toLocaleLowerCase()&&x.id!==id);if(same){if(!confirm(t().duplicate))return false;entries=entries.filter(x=>x.id!==same.id)}const rec={id:id??('r'+Date.now()+'_'+Math.random().toString(36).slice(2)),site:name,values:vals};const i=entries.findIndex(x=>x.id===id);if(i>=0)entries[i]=rec;else entries.push(rec);await persist();return rec.id}
function parseTSV(text){text=text.replace(/^\uFEFF/,'');const lines=text.split(/\r\n|\n|\r/).filter(x=>x.trim());if(!lines.length)return[];let start=0;const first=lines[0].split('\t').map(x=>x.trim().toLowerCase());if(first[0]==='site'||first[0]==='сайт')start=1;const result=[];for(let i=start;i<lines.length;i++){const p=lines[i].split('\t');if(p.length<6)continue;const vals=p.slice(0,6).map(x=>x.trim());if(vals[0])result.push(vals)}return result}
function renderImport(){const b=$('importPreview');b.innerHTML='';if(!importRows.length){$('confirmImport').disabled=true;return;}const p=document.createElement('p');p.className='muted';p.textContent=importRows.length+' '+t().found;b.appendChild(p);importRows.forEach((vals,i)=>{const row=document.createElement('label');row.className='checkrow';const cb=document.createElement('input');cb.type='checkbox';cb.checked=true;cb.dataset.imp=i;const span=document.createElement('span');span.textContent=vals[0];row.append(cb,span);b.appendChild(row)});$('confirmImport').disabled=false}
function renderExport(){const b=$('exportList');b.innerHTML='';for(const e of [...entries].sort((a,b)=>a.site.localeCompare(b.site))){const row=document.createElement('label');row.className='checkrow';const cb=document.createElement('input');cb.type='checkbox';cb.dataset.exp=e.id;const span=document.createElement('span');span.textContent=e.site;row.append(cb,span);b.appendChild(row)}$('confirmExport').disabled=entries.length===0;$('shareExport').disabled=entries.length===0}
function makeTSVFile(rows){
 const header=['Site','Identifiant','E-mail','Mot de passe','Notes','Noms alternatifs'];
 const content=[header,...rows].map(r=>r.map(x=>String(x??'').replace(/[\t\r\n]/g,' ')).join('\t')).join('\r\n')+'\r\n';

}
function downloadFile(file){const url=URL.createObjectURL(file),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function downloadTSV(rows){downloadFile(makeTSVFile(rows))}
async function exportThenOfferShare(rows){
 const file=makeTSVFile(rows);
 downloadFile(file);
 if(!confirm(t().afterExport))return;
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
  try{await navigator.share({files:[file],title:'Mon Coffre'});return}
  catch(err){if(err&&err.name==='AbortError')return}
 }
 alert(t().alreadySaved);
}
async function shareTSV(rows){
 if(!rows.length){alert(t().noSelection);return}
 if(!confirm(t().exportWarn+'\n'+t().confirm))return;
 const file=makeTSVFile(rows);
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){
   try{await navigator.share({files:[file],title:'Mon Coffre'});return}
   catch(err){if(err&&err.name==='AbortError')return;alert(t().shareError)}
 }else{alert(t().shareFallback)}
 downloadFile(file);
}
