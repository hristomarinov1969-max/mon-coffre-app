async function unlock(){if(busy||!secureAvailable())return;const pass=$('master').value,existing=storedVault();if(pass.length<12&&!existing){$('lockError').textContent=lang==='bg'?'Нужни са поне 12 знака.':'Au moins 12 caractères sont nécessaires.';return}if(!existing&&pass!==$('masterConfirm').value){$('lockError').textContent=lang==='bg'?'Паролите са различни.':'Les mots de passe ne correspondent pas.';return}busy=true;$('unlockBtn').disabled=true;$('lockError').textContent='';try{let key,salt,loaded=[];if(existing){const record=JSON.parse(existing);if(record.version!==1)throw Error('format');salt=fromB64(record.salt);key=await derive(pass,salt);loaded=await decryptVault(key,record)}else{salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);const payload=await encryptVault(key,salt,[]);localStorage.setItem(KEY,payload)}vaultKey=key;vaultSalt=salt;entries=loaded.filter(x=>x&&typeof x.site==='string'&&Array.isArray(x.values));$('master').value='';$('masterConfirm').value='';$('lockPage').classList.add('hidden');$('appArea').classList.remove('hidden');view('home');translate();startLock()}catch(e){$('lockError').textContent=lang==='bg'?'Грешна парола или недостъпно хранилище.':'Mot de passe incorrect ou stockage indisponible.'}finally{busy=false;$('unlockBtn').disabled=!secureAvailable()}}

let lang='fr',formLang='fr',entries=[],current=null,editId=null,showAll=false,importRows=[];const $=id=>document.getElementById(id),t=()=>labels[lang];
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function normalize(s){let str=String(s||'').toLowerCase().trim();const bg='абвгдежзийклмнопрстуфхцчшщъьюя',lat=['a','b','v','g','d','e','zh','z','i','y','k','l','m','n','o','p','r','s','t','u','f','h','ts','ch','sh','sht','a','','yu','ya'];let out='';for(const c of str){const i=bg.indexOf(c);out+=i>=0?lat[i]:c}return out.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/w/g,'v').replace(/ph/g,'f');}

// V8 update checker: public app files only; never modifies the encrypted vault in localStorage.
const APP_VERSION = 8.1;
let updateInProgress = false;
function updateLabels(){
 const bg=lang==='bg';
 $('updateTitle').textContent=bg?'Актуализации':'Mises à jour';
 $('installedVersion').textContent=(bg?'Инсталирана версия: V':'Version installée : V')+APP_VERSION;
 $('checkUpdateBtn').textContent=bg?'↻ Провери за актуализации':'↻ Vérifier les mises à jour';
}
function setUpdateStatus(message){$('updateStatus').textContent=message;}
$('checkUpdateBtn').onclick=async()=>{
 if(updateInProgress)return;
 const bg=lang==='bg';
 if(!navigator.onLine){setUpdateStatus(bg?'Нужна е интернет връзка.':'Une connexion Internet est nécessaire.');return;}
 updateInProgress=true;$('checkUpdateBtn').disabled=true;
 setUpdateStatus(bg?'Проверка…':'Vérification en cours…');
 try{
  const response=await fetch('./version.json?check='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw Error('network');
  const data=await response.json();
  if(!Number.isSafeInteger(data.version)||data.version<1)throw Error('version');
  if(data.version<=APP_VERSION){
   setUpdateStatus(bg?'Mon Coffre е актуален (V'+APP_VERSION+').':'Mon Coffre est à jour (V'+APP_VERSION+').');
   return;
  }
  const question=bg?'Налична е версия V'+data.version+'. Да се актуализира сега?':'La version V'+data.version+' est disponible. Mettre à jour maintenant ?';
  setUpdateStatus(bg?'Нова версия V'+data.version+' е налична.':'Nouvelle version V'+data.version+' disponible.');
  if(!confirm(question))return;
  if(!('serviceWorker' in navigator))throw Error('unsupported');
  const reg=await navigator.serviceWorker.getRegistration('./');
  if(!reg)throw Error('unsupported');
  setUpdateStatus(bg?'Подготовка на актуализацията…':'Préparation de la mise à jour…');
  // Reload only after a newly activated worker takes control, or ask user to reopen.
  let changed=false;
  const onChange=()=>{changed=true;window.location.reload()};
  navigator.serviceWorker.addEventListener('controllerchange',onChange,{once:true});
  await reg.update();
  if(reg.waiting){reg.waiting.postMessage({type:'SKIP_WAITING'});}
  await new Promise(resolve=>setTimeout(resolve,3500));
  if(!changed){
   navigator.serviceWorker.removeEventListener('controllerchange',onChange);
   setUpdateStatus(bg?'Затвори и отвори приложението отново, за да видиш новата версия.':'Ferme puis rouvre Mon Coffre pour afficher la nouvelle version.');
  }
 }catch(error){setUpdateStatus(bg?'Проверката не успя. Опитай по-късно.':'Vérification impossible pour le moment. Réessaie plus tard.');}
 finally{updateInProgress=false;$('checkUpdateBtn').disabled=false;}
};

const helpTexts={fr:{backup:'📦 Sauvegarde et transfert',safety:'🔒 Sécurité',appearance:'🎨 Apparence et style',updates:'↻ Application et mises à jour',help:'📖 Aide et conseils',excel:'Importer depuis Excel (TSV non chiffré)',excelCaution:'Attention : un fichier TSV contient les mots de passe en clair. Ne le partage jamais et ne le publie pas sur GitHub. À utiliser uniquement sur un appareil de confiance.',tsvNotice:'L’export TSV en clair est retiré de l’interface V8 pour éviter les erreurs. Utilise les sauvegardes chiffrées .mcoffre.',importExcel:'Importer depuis Excel',future:'Empreinte digitale et récupération par e-mail : à l’étude, non disponibles dans cette version.',style:'Choisir un style',themes:['Bleu nuit','Clair','Vert émeraude','Violet'],tips:'Astuces',manual:'Manuel d’utilisation',tipsHTML:'<ul><li>Utilise la recherche pour retrouver une fiche rapidement.</li><li>Appuie sur 🎤 pour dicter uniquement le nom d’un site (si le navigateur le permet).</li><li>Effectue régulièrement une sauvegarde chiffrée .mcoffre.</li><li>Ne partage jamais un fichier TSV contenant de vrais mots de passe.</li></ul>',manualHTML:'<ol><li>Crée un mot de passe principal d’au moins 12 caractères.</li><li>Ajoute une fiche ou retrouve-la par la recherche.</li><li>Pour importer Excel : Paramètres → Sauvegarde et transfert → Importer depuis Excel.</li><li>Pour transférer vers un autre appareil : exporte une sauvegarde .mcoffre chiffrée, puis importe-la sur l’autre appareil.</li><li>Pour changer ton mot de passe principal : Paramètres → Sécurité.</li><li>Pour choisir un thème : Paramètres → Apparence et style.</li><li>Pour rechercher une nouvelle version : Paramètres → Application et mises à jour.</li></ol><p>Important : une sauvegarde .mcoffre exige son mot de passe de transfert. L’application reste une version de test : n’y mets pas encore de vrais identifiants.</p>'},bg:{backup:'📦 Архив и прехвърляне',safety:'🔒 Сигурност',appearance:'🎨 Външен вид и стил',updates:'↻ Приложение и актуализации',help:'📖 Помощ и съвети',excel:'Импорт от Excel (некриптиран TSV)',excelCaution:'Внимание: TSV съдържа паролите в четим вид. Никога не го публикувай в GitHub или споделяй. Използвай само на доверено устройство.',tsvNotice:'Некриптираният TSV експорт е премахнат от интерфейса V8. Използвай криптирани архиви .mcoffre.',importExcel:'Импорт от Excel',future:'Пръстов отпечатък и възстановяване по имейл: в проучване, не са налични.',style:'Избери стил',themes:['Тъмносин','Светъл','Изумруден','Виолетов'],tips:'Съвети',manual:'Ръководство',tipsHTML:'<ul><li>Търси сайт по име.</li><li>Натисни 🎤, за да кажеш само името на сайта, ако браузърът го поддържа.</li><li>Прави редовно криптиран архив .mcoffre.</li><li>Не споделяй TSV с истински пароли.</li></ul>',manualHTML:'<ol><li>Създай главна парола с поне 12 знака.</li><li>Добави запис или го намери чрез търсене.</li><li>Импорт от Excel: Настройки → Архив и прехвърляне.</li><li>За друг телефон: експортирай и импортирай криптиран .mcoffre архив.</li><li>Смяна на главната парола: Настройки → Сигурност.</li><li>Промяна на стила: Настройки → Външен вид и стил.</li><li>Актуализации: Настройки → Приложение и актуализации.</li></ol><p>Важно: за възстановяване на .mcoffre е нужна паролата за прехвърляне. Това е тестова версия: не използвай истински пароли.</p>'}};

$('importBtn').onclick=()=>{importRows=[];$('files').value='';renderImport();view('importPage')};$('cancelImport').onclick=()=>view('home');$('files').onchange=async()=>{importRows=[];for(const file of $('files').files){try{importRows.push(...parseTSV(await file.text()))}catch{status(t().badFile)}}renderImport();if(!importRows.length)status(t().badFile)};$('confirmImport').onclick=async()=>{const checks=[...document.querySelectorAll('[data-imp]:checked')];if(!checks.length){alert(t().noSelection);return}let n=0;for(const cb of checks){if(await upsert(importRows[Number(cb.dataset.imp)],null))n++}view('home');renderResults();status(n+' — '+t().imported)};

function updateMasterEyes(){for(const [inputId,buttonId] of [['master','toggleMaster'],['masterConfirm','toggleConfirm']]){const visible=$(inputId).type==='text';$(buttonId).textContent=visible?'🙈':'👁';$(buttonId).setAttribute('aria-label',visible?(lang==='bg'?'Скрий паролата':'Masquer le mot de passe'):(lang==='bg'?'Покажи паролата':'Afficher le mot de passe'));$(buttonId).setAttribute('title',$(buttonId).getAttribute('aria-label'));$(buttonId).setAttribute('aria-pressed',String(visible))}}for(const [inputId,buttonId] of [['master','toggleMaster'],['masterConfirm','toggleConfirm']]){$(buttonId).onclick=()=>{$(inputId).type=$(inputId).type==='password'?'text':'password';updateMasterEyes()}};$('unlockBtn').onclick=unlock;$('master').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('masterConfirm').addEventListener('keydown',e=>{if(e.key==='Enter')unlock()});$('lockNow').onclick=lockVault;
